name: Temporary 132758 Validation

on:
  push:
    branches:
      - fix/132758-none-mode-history-reseed

permissions:
  contents: write

env:
  BASE_SHA: dc17d248cc62ac2ba6d754787c1fe99edf1d396f
  TARGET_BRANCH: fix/132758-none-mode-history-reseed
  NODE_VERSION: "24.19.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout validation wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve validator and reset to upstream base
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/temp-132758-validation.sh "$RUNNER_TEMP/validate-132758.sh"
          git fetch --no-tags https://github.com/openclaw/openclaw.git "$BASE_SHA"
          git reset --hard "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          dependency-cache: "true"
          node-version: "24.19.0"
          install-bun: "false"

      - name: Reproduce, repair, validate, and push
        shell: bash
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: bash "$RUNNER_TEMP/validate-132758.sh"
